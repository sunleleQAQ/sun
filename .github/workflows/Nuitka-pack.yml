name: Nuitka-pack

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.8.x'
          architecture: 'x64'
          cache: 'pip'
          
      - run: pip install -r requirements.txt

      - uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: start.py
          # 移除了 follow-imports，因为 standalone 模式默认就是全量打包
          mode: standalone
          # 使用 extra-args 传递原生参数，跳过导致崩溃的 importlib 模块
          extra-args: >-
            --no-follow-imports-to=importlib
            --windows-disable-console
          # 使用绝对路径确保能找到文件
          include-data-files: ${{ github.workspace }}/res/frpc.exe=res/frpc.exe
          enable-plugins: tk-inter
          assume-yes-for-downloads: true
          output-dir: build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XCL II-Canary
          path: build/
