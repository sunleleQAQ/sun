name: Nuitka-Pack

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          architecture: 'x64'
          cache: 'pip'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      # 【调试】打印文件结构，确保 res/frpc.exe 存在
      - name: Debug File Structure
        run: |
          echo "当前目录:"
          dir
          echo "res 目录内容:"
          if exist res (dir res) else (echo res folder does not exist)

      - name: Build with Nuitka
        uses: Nuitka/Nuitka-Action@main
        with:
          nuitka-version: main
          script-name: start.py
          mode: standalone
          # 修正点1: 使用 extra-args 传递原生 Nuitka 参数
          extra-args: --follow-imports
          # 修正点2: 使用 ${{ github.workspace }} 确保绝对路径正确
          include-data-files: ${{ github.workspace }}/res/frpc.exe=res/frpc.exe
          enable-plugins: tk-inter
          output-dir: build

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: XCL-II-Canary
          path: build/
